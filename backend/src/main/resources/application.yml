spring:
  application:
    name: assessly-backend
  data:
    redis:
      host: ${ASSESSLY_REDIS_HOST:localhost}
      port: ${ASSESSLY_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    url: ${ASSESSLY_DATABASE_URL:jdbc:postgresql://localhost:5432/assessly}
    username: ${ASSESSLY_DATABASE_USERNAME:assessly}
    password: ${ASSESSLY_DATABASE_PASSWORD:assessly-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never

assessly:
  frontend-origin: ${ASSESSLY_FRONTEND_ORIGIN:http://localhost:5173}
  redis:
    prewarm-minutes-before: ${ASSESSLY_REDIS_PREWARM_MINUTES:15}
    sync-interval-ms: ${ASSESSLY_REDIS_SYNC_INTERVAL_MS:30000}
    timer-reaper-interval-ms: ${ASSESSLY_REDIS_TIMER_REAPER_INTERVAL_MS:1000}
    timer-grace-ms: ${ASSESSLY_REDIS_TIMER_GRACE_MS:5000}
  jwt:
    private-key-base64: ${ASSESSLY_JWT_PRIVATE_KEY_BASE64}
    public-key-base64: ${ASSESSLY_JWT_PUBLIC_KEY_BASE64}
    access-token-ttl: ${ASSESSLY_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${ASSESSLY_REFRESH_TOKEN_TTL:P30D}
    refresh-cookie-name: ${ASSESSLY_REFRESH_COOKIE_NAME:assessly_refresh}
    refresh-cookie-secure: ${ASSESSLY_REFRESH_COOKIE_SECURE:false}
  rate-limit:
    enabled: ${ASSESSLY_RATE_LIMIT_ENABLED:true}
    login-limit: ${ASSESSLY_RATE_LIMIT_LOGIN_LIMIT:5}
    login-window-seconds: ${ASSESSLY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    signup-limit: ${ASSESSLY_RATE_LIMIT_SIGNUP_LIMIT:5}
    signup-window-seconds: ${ASSESSLY_RATE_LIMIT_SIGNUP_WINDOW_SECONDS:900}
    refresh-limit: ${ASSESSLY_RATE_LIMIT_REFRESH_LIMIT:30}
    refresh-window-seconds: ${ASSESSLY_RATE_LIMIT_REFRESH_WINDOW_SECONDS:900}
    candidate-start-limit: ${ASSESSLY_RATE_LIMIT_CANDIDATE_START_LIMIT:10}
    candidate-start-window-seconds: ${ASSESSLY_RATE_LIMIT_CANDIDATE_START_WINDOW_SECONDS:60}
    candidate-action-limit: ${ASSESSLY_RATE_LIMIT_CANDIDATE_ACTION_LIMIT:100}
    candidate-action-window-seconds: ${ASSESSLY_RATE_LIMIT_CANDIDATE_ACTION_WINDOW_SECONDS:60}
    candidate-submit-limit: ${ASSESSLY_RATE_LIMIT_CANDIDATE_SUBMIT_LIMIT:5}
    candidate-submit-window-seconds: ${ASSESSLY_RATE_LIMIT_CANDIDATE_SUBMIT_WINDOW_SECONDS:60}
