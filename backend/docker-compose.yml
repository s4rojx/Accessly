services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessly}
      POSTGRES_USER: ${POSTGRES_USER:-assessly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessly-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - assessly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  assessly-postgres-data:
